services:
  - type: web
    name: birthday-wisher
    env: php
    startCommand: "php -S 0.0.0.0:$PORT -t ."
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: birthday-db
          property: connectionString
      - key: PHP_VERSION
        value: 8.2

databases:
  - name: birthday-db
    plan: free
    databaseName: birthday_wishes
    user: birthday_user