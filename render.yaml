services:
  - type: web
    name: birthday-wisher
    runtime: docker
    dockerfilePath: ./Dockerfile
    startCommand: "php -S 0.0.0.0:$PORT -t ."
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: birthday-db
          property: connectionString

databases:
  - name: birthday-db
    plan: free
    databaseName: birthday_wishes
    user: birthday_user
